openapi: 3.1.0
info:
  title: Cleanora R1-P07 Provider Workforce API
  version: 0.1.0-design
  description: >-
    Design contract for Provider-owned Worker, invitation/access, Team,
    membership, Supervisor, history, and workersReady behavior. This file is
    mounted as the R1-P07 runtime contract. It exposes no booking,
    public Worker profile, payroll, payout, raw Prisma record, storage key,
    audit payload, or persisted invitation token.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Provider Workers
  - name: Provider Teams
  - name: Worker Self Service
  - name: Worker Invitations
paths:
  /providers/{providerId}/workers:
    get:
      tags: [Provider Workers]
      operationId: listProviderWorkers
      x-requirement-ids: [FR-025, FR-027, FR-033, FR-036, FR-037, FR-038, FR-088]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {$ref: '#/components/responses/WorkerList'}
        '403': {$ref: '#/components/responses/Failure'}
        '404': {$ref: '#/components/responses/Failure'}
    post:
      tags: [Provider Workers]
      operationId: createProviderWorkerDraft
      x-requirement-ids: [FR-001, FR-002, FR-021, FR-052, FR-076, FR-077]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkerInput'}
      responses:
        '201': {$ref: '#/components/responses/WorkerPrivate'}
        '400': {$ref: '#/components/responses/Failure'}
        '403': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/workers/{workerId}:
    get:
      tags: [Provider Workers]
      operationId: getProviderWorker
      x-requirement-ids: [FR-025, FR-026, FR-027, FR-028, FR-037, FR-038]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/WorkerId'
      responses:
        '200': {$ref: '#/components/responses/WorkerPrivate'}
        '403': {$ref: '#/components/responses/Failure'}
        '404': {$ref: '#/components/responses/Failure'}
    put:
      tags: [Provider Workers]
      operationId: replaceProviderWorkerProfile
      x-requirement-ids: [FR-021, FR-022, FR-023, FR-024, FR-052, FR-053, FR-056, FR-057, FR-078]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceWorkerProfileInput'}
      responses:
        '200': {$ref: '#/components/responses/WorkerPrivate'}
        '400': {$ref: '#/components/responses/Failure'}
        '403': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/workers/{workerId}/avatar:
    post:
      tags: [Provider Workers]
      operationId: uploadProviderWorkerAvatar
      x-requirement-ids: [FR-029, FR-030, FR-031, FR-076]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/AvatarUploadInput'}
      responses:
        '202': {$ref: '#/components/responses/Command'}
        '400': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
        '413': {$ref: '#/components/responses/Failure'}
        '415': {$ref: '#/components/responses/Failure'}
    delete:
      tags: [Provider Workers]
      operationId: removeProviderWorkerAvatar
      x-requirement-ids: [FR-031, FR-076, FR-079]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VersionCommand'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '409': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/workers/{workerId}/lifecycle-commands:
    post:
      tags: [Provider Workers]
      operationId: commandProviderWorkerLifecycle
      x-requirement-ids: [FR-042, FR-043, FR-044, FR-045, FR-046, FR-047, FR-050, FR-051, FR-074, FR-075, FR-081, FR-082]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkerLifecycleCommand'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '400': {$ref: '#/components/responses/Failure'}
        '403': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/workers/{workerId}/login-access-commands:
    post:
      tags: [Provider Workers]
      operationId: commandProviderWorkerLoginAccess
      x-requirement-ids: [FR-010, FR-011, FR-013, FR-014, FR-015, FR-019, FR-040, FR-076, FR-084]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginAccessCommand'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '201': {$ref: '#/components/responses/Command'}
        '400': {$ref: '#/components/responses/Failure'}
        '403': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/workers/{workerId}/admin-membership-commands:
    post:
      tags: [Provider Workers]
      operationId: commandProviderWorkerAdminMembership
      x-requirement-ids: [FR-033, FR-034, FR-035, FR-039, FR-040, FR-076, FR-081, FR-082]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminMembershipCommand'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '400': {$ref: '#/components/responses/Failure'}
        '403': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/workers/{workerId}/history:
    get:
      tags: [Provider Workers]
      operationId: listProviderWorkerHistory
      x-requirement-ids: [FR-079, FR-080, FR-087, FR-088]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/WorkerId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {$ref: '#/components/responses/HistoryList'}
        '403': {$ref: '#/components/responses/Failure'}
        '404': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/teams:
    get:
      tags: [Provider Teams]
      operationId: listProviderTeams
      x-requirement-ids: [FR-036, FR-037, FR-059, FR-060, FR-088]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {$ref: '#/components/responses/TeamList'}
        '403': {$ref: '#/components/responses/Failure'}
    post:
      tags: [Provider Teams]
      operationId: createProviderTeamDraft
      x-requirement-ids: [FR-060, FR-061, FR-062, FR-076, FR-077]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTeamInput'}
      responses:
        '201': {$ref: '#/components/responses/Command'}
        '400': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/teams/{teamId}:
    get:
      tags: [Provider Teams]
      operationId: getProviderTeam
      x-requirement-ids: [FR-025, FR-026, FR-037, FR-059, FR-064, FR-069]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200': {$ref: '#/components/responses/TeamPrivate'}
        '403': {$ref: '#/components/responses/Failure'}
        '404': {$ref: '#/components/responses/Failure'}
    put:
      tags: [Provider Teams]
      operationId: replaceProviderTeamName
      x-requirement-ids: [FR-036, FR-037, FR-061, FR-076, FR-078]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceTeamInput'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '400': {$ref: '#/components/responses/Failure'}
        '403': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/teams/{teamId}/lifecycle-commands:
    post:
      tags: [Provider Teams]
      operationId: commandProviderTeamLifecycle
      x-requirement-ids: [FR-060, FR-063, FR-067, FR-068, FR-076, FR-078]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamLifecycleCommand'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '400': {$ref: '#/components/responses/Failure'}
        '403': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/teams/{teamId}/membership-commands:
    post:
      tags: [Provider Teams]
      operationId: commandProviderTeamMembership
      x-requirement-ids: [FR-037, FR-050, FR-051, FR-054, FR-056, FR-059, FR-063, FR-069, FR-076]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamMembershipCommand'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '201': {$ref: '#/components/responses/Command'}
        '400': {$ref: '#/components/responses/Failure'}
        '403': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/teams/{teamId}/supervisor-commands:
    post:
      tags: [Provider Teams]
      operationId: commandProviderTeamSupervisor
      x-requirement-ids: [FR-053, FR-064, FR-065, FR-066, FR-076]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupervisorCommand'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '400': {$ref: '#/components/responses/Failure'}
        '403': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/teams/{teamId}/history:
    get:
      tags: [Provider Teams]
      operationId: listProviderTeamHistory
      x-requirement-ids: [FR-059, FR-068, FR-079, FR-087, FR-088]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {$ref: '#/components/responses/HistoryList'}
        '403': {$ref: '#/components/responses/Failure'}
        '404': {$ref: '#/components/responses/Failure'}
  /providers/{providerId}/workforce-readiness:
    get:
      tags: [Provider Workers]
      operationId: getProviderWorkforceReadiness
      x-requirement-ids: [FR-070, FR-071, FR-072, FR-073, FR-074, FR-075]
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200': {$ref: '#/components/responses/Readiness'}
        '403': {$ref: '#/components/responses/Failure'}
  /workers/me:
    get:
      tags: [Worker Self Service]
      operationId: getCurrentWorkerContext
      x-requirement-ids: [FR-025, FR-038, FR-088]
      responses:
        '200': {$ref: '#/components/responses/WorkerPrivate'}
        '404': {$ref: '#/components/responses/Failure'}
  /workers/me/leave:
    post:
      tags: [Worker Self Service]
      operationId: leaveCurrentProvider
      x-requirement-ids: [FR-008, FR-009, FR-048, FR-049, FR-050, FR-051, FR-076]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkerLeaveCommand'}
      responses:
        '200': {$ref: '#/components/responses/Command'}
        '400': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /worker-invitations/inspect:
    post:
      tags: [Worker Invitations]
      operationId: inspectWorkerInvitation
      security: []
      x-requirement-ids: [FR-013, FR-014, FR-015, FR-016, FR-028]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvitationProofInput'}
      responses:
        '200': {$ref: '#/components/responses/InvitationInspection'}
        '400': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /worker-invitations/onboarding/start:
    post:
      tags: [Worker Invitations]
      operationId: startWorkerInvitationOnboarding
      security: []
      x-requirement-ids: [FR-011, FR-012, FR-016, FR-020]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvitationOnboardingStartInput'}
      responses:
        '200': {$ref: '#/components/responses/OnboardingStart'}
        '400': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /worker-invitations/onboarding/verify-email:
    post:
      tags: [Worker Invitations]
      operationId: verifyWorkerInvitationEmail
      security: []
      x-requirement-ids: [FR-012, FR-016, FR-020]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvitationEmailVerificationInput'}
      responses:
        '200': {$ref: '#/components/responses/OnboardingVerify'}
        '400': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
  /worker-invitations/accept:
    post:
      tags: [Worker Invitations]
      operationId: acceptWorkerInvitation
      x-requirement-ids: [FR-003, FR-004, FR-005, FR-006, FR-012, FR-016, FR-017, FR-018, FR-020]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvitationAcceptInput'}
      responses:
        '200': {$ref: '#/components/responses/WorkerPrivate'}
        '400': {$ref: '#/components/responses/Failure'}
        '403': {$ref: '#/components/responses/Failure'}
        '409': {$ref: '#/components/responses/Failure'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    WorkerId:
      name: workerId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    TeamId:
      name: teamId
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
  responses:
    Command:
      description: Versioned idempotent command result with only safe impact facts.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommandSuccessEnvelope'}
    WorkerList:
      description: Bounded Worker summaries; operational phone is absent.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkerListSuccessEnvelope'}
    WorkerPrivate:
      description: Authorized role-specific Worker DTO with no generic caching.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, private'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkerPrivateSuccessEnvelope'}
    TeamList:
      description: Bounded Team summaries.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TeamListSuccessEnvelope'}
    TeamPrivate:
      description: Authorized Team detail; member phones remain absent and require a separately authorized Worker detail read.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, private'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TeamPrivateSuccessEnvelope'}
    HistoryList:
      description: Bounded immutable safe history facts.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/HistoryListSuccessEnvelope'}
    Readiness:
      description: Derived workersReady facts; not a writable flag.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReadinessSuccessEnvelope'}
    InvitationInspection:
      description: Safe latest-invitation inspection with no identity-existence or bearer-proof echo.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, private'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/InvitationInspectionSuccessEnvelope'}
    OnboardingStart:
      description: Safe fixed-email onboarding challenge result.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, private'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OnboardingStartSuccessEnvelope'}
    OnboardingVerify:
      description: Restricted onboarding verification result. Tokens are returned only on this purpose-specific no-store Authentication handoff and remain prohibited from logs/history/audit/outbox/errors.
      headers:
        Cache-Control:
          schema: {type: string, const: 'no-store, private'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OnboardingVerifySuccessEnvelope'}
    Failure:
      description: Stable safe failure envelope with no private existence, phone, proof, credential, or internal detail.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FailureEnvelope'}
  schemas:
    IdempotencyKey:
      type: string
      format: uuid
    PositiveVersion:
      type: integer
      minimum: 1
    Locale:
      type: string
      enum: [AR, EN]
    WorkerType:
      type: string
      enum: [CLEANING_STAFF, ESCORT, OTHER]
    WorkerGender:
      type: string
      enum: [male, female]
    ReasonNote:
      type: string
      minLength: 10
      maxLength: 1000
    VersionCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, idempotencyKey]
      properties:
        expectedVersion: {$ref: '#/components/schemas/PositiveVersion'}
        idempotencyKey: {$ref: '#/components/schemas/IdempotencyKey'}
    CreateWorkerInput:
      type: object
      additionalProperties: false
      required: [fullLegalName, gender, operationalPhoneE164, workerType, expectedVersion, idempotencyKey]
      properties:
        fullLegalName: {type: string, minLength: 1, maxLength: 200}
        gender: {$ref: '#/components/schemas/WorkerGender'}
        operationalPhoneE164: {type: string, pattern: '^\\+[1-9][0-9]{7,14}$'}
        workerType: {$ref: '#/components/schemas/WorkerType'}
        displayTitle: {type: [string, 'null'], maxLength: 120}
        supervisorCapable: {type: boolean, default: false}
        skillTags:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 100}
        expectedVersion: {$ref: '#/components/schemas/PositiveVersion'}
        idempotencyKey: {$ref: '#/components/schemas/IdempotencyKey'}
      description: expectedVersion is the Provider workforce-state version used to serialize creation of a new Worker aggregate.
    ReplaceWorkerProfileInput:
      type: object
      additionalProperties: false
      required: [fullLegalName, gender, operationalPhoneE164, workerType, supervisorCapable, skillTags, expectedVersion, idempotencyKey]
      properties:
        fullLegalName: {type: string, minLength: 1, maxLength: 200}
        gender: {$ref: '#/components/schemas/WorkerGender'}
        operationalPhoneE164: {type: string, pattern: '^\\+[1-9][0-9]{7,14}$'}
        workerType: {$ref: '#/components/schemas/WorkerType'}
        displayTitle: {type: [string, 'null'], maxLength: 120}
        supervisorCapable: {type: boolean}
        skillTags:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 100}
        expectedVersion: {$ref: '#/components/schemas/PositiveVersion'}
        idempotencyKey: {$ref: '#/components/schemas/IdempotencyKey'}
      description: expectedVersion is the exact Worker-profile version. A CLEANING_STAFF-to-ESCORT request conflicts while the current membership still has cleans=true.
    AvatarUploadInput:
      type: object
      additionalProperties: false
      required: [file, expectedVersion, idempotencyKey]
      properties:
        file: {type: string, format: binary}
        expectedVersion: {$ref: '#/components/schemas/PositiveVersion'}
        idempotencyKey: {$ref: '#/components/schemas/IdempotencyKey'}
    WorkerLifecycleCommand:
      type: object
      additionalProperties: false
      required: [action, expectedVersion, idempotencyKey]
      properties:
        action: {type: string, enum: [ACTIVATE, DEACTIVATE, REACTIVATE, REMOVE]}
        expectedVersion: {$ref: '#/components/schemas/PositiveVersion'}
        expectedTeamVersion: {type: [integer, 'null'], minimum: 1}
        expectedMembershipVersion: {type: [integer, 'null'], minimum: 1}
        idempotencyKey: {$ref: '#/components/schemas/IdempotencyKey'}
        reasonCode:
          type: [string, 'null']
          enum: [TEMPORARILY_UNAVAILABLE, SCHEDULE_OR_LEAVE, PERFORMANCE_OR_POLICY, PROVIDER_OPERATIONAL_CHANGE, ENGAGEMENT_ENDED, DUPLICATE_OR_INCORRECT_RECORD, OTHER, null]
        note: {oneOf: [{$ref: '#/components/schemas/ReasonNote'}, {type: 'null'}]}
        confirmTeamImpact: {type: boolean, default: false}
        confirmReadinessImpact: {type: boolean, default: false}
        recentAuthenticationProof: {type: [string, 'null'], minLength: 1}
      description: Domain validation restricts reasonCode to the action-specific DEC-039 catalog and requires note for REMOVE or OTHER.
    LoginAccessCommand:
      type: object
      additionalProperties: false
      required: [action, expectedVersion, expectedAccessVersion, idempotencyKey, recentAuthenticationProof]
      properties:
        action: {type: string, enum: [ISSUE_INVITATION, RESEND_INVITATION, RESET_ACCESS, REVOKE_ACCESS]}
        expectedVersion: {$ref: '#/components/schemas/PositiveVersion'}
        expectedAccessVersion: {type: [integer, 'null'], minimum: 1}
        idempotencyKey: {$ref: '#/components/schemas/IdempotencyKey'}
        email: {type: [string, 'null'], format: email, maxLength: 320}
        locale: {oneOf: [{$ref: '#/components/schemas/Locale'}, {type: 'null'}]}
        reasonCode: {type: [string, 'null'], enum: [SECURITY_CONCERN, ACCESS_NO_LONGER_REQUIRED, ENGAGEMENT_ENDED, OTHER, null]}
        note: {oneOf: [{$ref: '#/components/schemas/ReasonNote'}, {type: 'null'}]}
        recentAuthenticationProof: {type: string, minLength: 1}
      description: expectedVersion is the Worker version. expectedAccessVersion is explicit null before the first invitation and exact thereafter. ISSUE/RESEND require email and locale; REVOKE requires its closed reason catalog; OTHER requires note.
    AdminMembershipCommand:
      type: object
      additionalProperties: false
      required: [action, expectedVersion, expectedMembershipVersion, idempotencyKey, reasonCode, recentAuthenticationProof]
      properties:
        action: {type: string, enum: [GRANT, REVOKE]}
        expectedVersion: {$ref: '#/components/schemas/PositiveVersion'}
        expectedMembershipVersion: {type: [integer, 'null'], minimum: 1}
        idempotencyKey: {$ref: '#/components/schemas/IdempotencyKey'}
        reasonCode:
          type: string
          enum: [OPERATIONAL_RESPONSIBILITY, COVERAGE_OR_BACKUP, RESPONSIBILITY_ENDED, SECURITY_CONCERN, ENGAGEMENT_ENDED, OTHER]
        note: {oneOf: [{$ref: '#/components/schemas/ReasonNote'}, {type: 'null'}]}
        recentAuthenticationProof: {type: string, minLength: 1}
