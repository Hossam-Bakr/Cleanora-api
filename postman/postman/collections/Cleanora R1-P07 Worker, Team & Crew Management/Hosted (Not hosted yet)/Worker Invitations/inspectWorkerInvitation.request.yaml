$kind: http-request
description: R1-P07 inspectWorkerInvitation.
url: "{{hostUrl}}/worker-invitations/inspect"
method: POST
headers:
  Accept: application/json
  x-request-id: "{{requestId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "invitationProof": "{{invitationProof}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected documented status", () => pm.expect(pm.response.code).to.be.oneOf([200, 400, 409 ]));
      pm.test("Envelope status code", () => { const body = pm.response.json(); if (!body.success) pm.expect(body.error.statusCode).to.eql(pm.response.code); });
      pm.test("Private response is not cached", () => { const value = pm.response.headers.get("Cache-Control"); if (value) pm.expect(value).to.include("no-store"); });
    language: text/javascript
examples: ./.resources/inspectWorkerInvitation.resources/examples
order: 1000
