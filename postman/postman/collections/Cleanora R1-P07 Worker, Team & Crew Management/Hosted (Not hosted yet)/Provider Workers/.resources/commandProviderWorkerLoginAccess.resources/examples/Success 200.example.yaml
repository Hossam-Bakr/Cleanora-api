$kind: http-example
request:
  url: "{{hostUrl}}/providers/{{providerId}}/workers/{{workerId}}/login-access-commands"
  method: POST
  headers:
    Accept: application/json
    x-request-id: "{{requestId}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "expectedVersion": 1,
        "idempotencyKey": "00000000-0000-4000-8000-000000000008",
        "action": "ISSUE_INVITATION",
        "expectedAccessVersion": null,
        "email": "{{workerInvitationEmail}}",
        "locale": "AR",
        "recentAuthenticationProof": "{{recentAuthenticationProof}}"
      }
response:
  statusCode: 200
  statusText: Synthetic success
  headers:
    Content-Type: application/json
    Cache-Control: no-store, private
  body:
    type: text
    content: |-
      {
        "success": true,
        "data": {
          "outcomeCode": "SYNTHETIC_SUCCESS"
        },
        "requestId": "00000000-0000-4000-8000-000000000007"
      }
order: 1000
