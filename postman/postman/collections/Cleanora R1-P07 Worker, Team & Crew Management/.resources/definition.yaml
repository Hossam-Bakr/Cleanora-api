$kind: collection
description: Credential-free synthetic examples for the complete R1-P07 runtime contract. No real phone, email, password, OTP, invitation proof, access token, SMTP value, Cloudinary key, or database URL is stored.
variables:
  baseUrl: http://localhost:8000/api/v1
  hostUrl: https://YOUR-HOSTED-DOMAIN.example/api/v1
  requestId: 00000000-0000-4000-8000-000000000007
  providerId: synthetic-provider-id
  workerId: synthetic-worker-id
  teamId: synthetic-team-id
  membershipId: synthetic-membership-id
  accessToken: ""
  workerOperationalPhone: ""
  workerInvitationEmail: ""
  recentAuthenticationProof: ""
  invitationProof: ""
  workerPassword: ""
  workerInvitationChallengeId: ""
  workerEmailCode: ""
  workerAvatarFile: ""
auth:
  - id: 30d2beed-50f5-4d99-97b4-805424fb96d0
    type: bearer
    name: bearer auth
    credentials:
      token: "{{accessToken}}"
