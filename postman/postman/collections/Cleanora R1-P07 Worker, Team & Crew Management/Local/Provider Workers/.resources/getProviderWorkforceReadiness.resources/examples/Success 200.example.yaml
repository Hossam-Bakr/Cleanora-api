$kind: http-example
request:
  url: "{{baseUrl}}/providers/{{providerId}}/workforce-readiness"
  method: GET
  headers:
    Accept: application/json
    x-request-id: "{{requestId}}"
response:
  statusCode: 200
  statusText: Synthetic success
  headers:
    Content-Type: application/json
    Cache-Control: no-store, private
  body:
    type: text
