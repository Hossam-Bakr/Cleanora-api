$kind: http-request
description: Creates a deliberate LINK transaction for the current fully verified Individual. Navigate to the returned URL in the same browser.
url: "{{hostUrl}}/auth/google/link"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Uses the Cleanora response envelope', () => {
        pm.expect(body.success).to.eql(true);
        pm.expect(body.requestId).to.be.a('string');
      });
      if (body.data?.challengeId) pm.environment.set('challengeId', body.data.challengeId);
      if (body.data?.accessToken) pm.environment.set('accessToken', body.data.accessToken);
    language: text/javascript
examples: ./.resources/Start Google Link.resources/examples
order: 4000
