$kind: http-request
description: Combines the opaque challengeId returned by forgot-password with the four-digit passwordResetCode delivered to the user.
url: "{{hostUrl}}/auth/password/reset"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "challengeId": "{{challengeId}}",
      "code": "{{passwordResetCode}}",
      "newPassword": "{{newPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Uses the Cleanora response envelope', () => {
        pm.expect(body.success).to.eql(true);
        pm.expect(body.requestId).to.be.a('string');
      });
      if (body.data?.challengeId) pm.environment.set('challengeId', body.data.challengeId);
      if (body.data?.accessToken) pm.environment.set('accessToken', body.data.accessToken);
    language: text/javascript
examples: ./.resources/Reset Password.resources/examples
order: 6000
