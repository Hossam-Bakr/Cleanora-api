$kind: http-request
description: "Uses the HttpOnly refresh cookie in the Postman/browser cookie jar, stores the new accessToken, and returns the canonical safe user. Browser code must use credentials: include."
url: "{{hostUrl}}/auth/refresh"
method: POST
headers:
  Origin: "{{origin}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Uses the Cleanora response envelope', () => {
        pm.expect(body.success).to.eql(true);
        pm.expect(body.requestId).to.be.a('string');
      });
      if (body.data?.challengeId) pm.environment.set('challengeId', body.data.challengeId);
      if (body.data?.accessToken) pm.environment.set('accessToken', body.data.accessToken);
    language: text/javascript
examples: ./.resources/Refresh Session.resources/examples
order: 1000
