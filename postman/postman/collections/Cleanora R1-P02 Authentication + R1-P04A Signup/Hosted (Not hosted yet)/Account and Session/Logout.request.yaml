$kind: http-request
description: Revokes the current Bearer/cookie session and clears the refresh cookie.
url: "{{hostUrl}}/auth/logout"
method: POST
headers:
  Origin: "{{origin}}"
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Uses the Cleanora response envelope', () => {
        pm.expect(body.success).to.eql(true);
        pm.expect(body.requestId).to.be.a('string');
      });
      if (body.data?.challengeId) pm.environment.set('challengeId', body.data.challengeId);
      if (body.data?.accessToken) pm.environment.set('accessToken', body.data.accessToken);
    language: text/javascript
examples: ./.resources/Logout.resources/examples
order: 5000
