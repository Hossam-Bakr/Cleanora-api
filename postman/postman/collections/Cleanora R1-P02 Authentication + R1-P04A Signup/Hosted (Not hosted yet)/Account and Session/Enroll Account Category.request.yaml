$kind: http-request
description: Adds one supported category to the current fully authenticated identity.
url: "{{hostUrl}}/auth/account-categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "accountCategory": "COMPANY",
      "companyName": "{{companyName}}",
      "representativeFullName": "{{representativeFullName}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Uses the Cleanora response envelope', () => {
        pm.expect(body.success).to.eql(true);
        pm.expect(body.requestId).to.be.a('string');
      });
      if (body.data?.challengeId) pm.environment.set('challengeId', body.data.challengeId);
      if (body.data?.accessToken) pm.environment.set('accessToken', body.data.accessToken);
    language: text/javascript
examples: ./.resources/Enroll Account Category.resources/examples
order: 3000
