$kind: http-example
request:
  url: "{{baseUrl}}/auth/password/reset"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "challengeId": "{{challengeId}}",
        "code": "{{passwordResetCode}}",
        "newPassword": "{{newPassword}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "passwordReset": true,
          "nextAction": "LOGIN"
        },
        "requestId": "7ebf45ad-7384-41ab-8e74-e864ae048d30"
      }
order: 1000
