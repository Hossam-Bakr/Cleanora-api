$kind: http-request
description: Enumeration-safe recovery request. Every valid request returns an opaque challengeId. Existing eligible accounts receive a four-digit code out of band.
url: "{{baseUrl}}/auth/password/forgot"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "accountCategory": "INDIVIDUAL",
      "identifier": "{{testEmail}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Uses the Cleanora response envelope', () => {
        pm.expect(body.success).to.eql(true);
        pm.expect(body.requestId).to.be.a('string');
      });
      if (body.data?.challengeId) pm.environment.set('challengeId', body.data.challengeId);
      if (body.data?.accessToken) pm.environment.set('accessToken', body.data.accessToken);
    language: text/javascript
examples: ./.resources/Forgot Password.resources/examples
order: 5000
