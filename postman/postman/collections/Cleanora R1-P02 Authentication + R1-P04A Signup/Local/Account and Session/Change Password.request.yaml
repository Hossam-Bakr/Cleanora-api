$kind: http-request
description: Requires Bearer access, the refresh cookie, and trusted Origin. Rotates the current session and returns the same safe user shape.
url: "{{baseUrl}}/auth/password/change"
method: POST
headers:
  Content-Type: application/json
  Origin: "{{origin}}"
body:
  type: json
  content: |-
    {
      "currentPassword": "{{testPassword}}",
      "newPassword": "{{newPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Uses the Cleanora response envelope', () => {
        pm.expect(body.success).to.eql(true);
        pm.expect(body.requestId).to.be.a('string');
      });
      if (body.data?.challengeId) pm.environment.set('challengeId', body.data.challengeId);
      if (body.data?.accessToken) pm.environment.set('accessToken', body.data.accessToken);
    language: text/javascript
examples: ./.resources/Change Password.resources/examples
order: 4000
