$kind: http-example
request:
  url: "{{hostUrl}}/providers/{{providerId}}/media/gallery-images"
  method: POST
  headers:
    Accept: application/json
  body:
    type: formdata
    content:
      - type: file
        key: file
        src:
          - "{{providerGalleryImagePath}}"
        description: Select the private local file in your Postman environment.
      - type: text
        key: expectedVersion
        value: "{{providerVersion}}"
        description: Current Provider aggregate version.
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "providerId": "provider_example_01",
          "logo": {
            "id": "media_logo_01",
            "type": "LOGO",
            "status": "READY",
            "url": "https://res.cloudinary.com/example/image/upload/provider-logo.webp"
          },
          "cover": {
            "id": "media_cover_01",
            "type": "COVER",
            "status": "READY",
            "url": "https://res.cloudinary.com/example/image/upload/provider-cover.webp"
          },
          "gallery": [
            {
              "id": "gallery_image_01",
              "type": "GALLERY_IMAGE",
              "status": "READY",
              "position": 1,
              "url": "https://res.cloudinary.com/example/image/upload/gallery-01.webp"
            }
          ],
          "version": 8,
          "id": "gallery_image_01",
          "galleryItemId": "gallery_image_01"
        },
        "requestId": "request_example_01"
      }
order: 1000
