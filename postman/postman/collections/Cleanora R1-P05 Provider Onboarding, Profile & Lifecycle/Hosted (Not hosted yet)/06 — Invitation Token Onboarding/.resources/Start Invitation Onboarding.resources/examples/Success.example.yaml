$kind: http-example
request:
  url: "{{hostUrl}}/provider-admin-invitations/onboarding/start"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "token": "{{providerAdminInvitationToken}}",
        "phone": "{{invitedAdminPhone}}",
        "password": "{{testPassword}}"
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "challengeId": "challenge_example_01",
          "channel": "EMAIL",
          "maskedDestination": "pr********@example.com",
          "expiresAt": "2026-08-13T10:10:00.000Z",
          "nextAction": "VERIFY_EMAIL"
        },
        "requestId": "request_example_01"
      }
order: 1000
