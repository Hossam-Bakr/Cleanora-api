$kind: http-example
request:
  url: "{{hostUrl}}/providers/{{providerId}}/kind"
  method: PATCH
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "providerKind": "{{alternateProviderKind}}",
        "expectedVersion": {{providerVersion}}
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "id": "provider_example_01",
          "providerKind": "REGISTERED_COMPANY",
          "applicationStatus": "DRAFT",
          "operationalStatus": "INACTIVE",
          "version": 2,
          "createdAt": "2026-08-13T10:00:00.000Z",
          "updatedAt": "2026-08-13T10:00:00.000Z"
        },
        "requestId": "request_example_01"
      }
order: 1000
