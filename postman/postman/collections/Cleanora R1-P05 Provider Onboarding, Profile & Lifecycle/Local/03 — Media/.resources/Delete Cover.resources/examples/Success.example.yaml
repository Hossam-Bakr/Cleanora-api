$kind: http-example
request:
  url: "{{baseUrl}}/providers/{{providerId}}/media/cover"
  method: DELETE
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "expectedVersion": {{providerVersion}}
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
