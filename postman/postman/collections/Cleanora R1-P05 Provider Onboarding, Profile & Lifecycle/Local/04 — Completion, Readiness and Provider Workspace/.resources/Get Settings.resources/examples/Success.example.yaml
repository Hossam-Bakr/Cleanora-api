$kind: http-example
request:
  url: "{{baseUrl}}/providers/{{providerId}}/settings"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "providerId": "provider_example_01",
          "capabilities": {
            "canEditProfile": true,
            "canEditContacts": true,
            "canManageMedia": true,
            "canManageAdmins": true,
            "canSubmitApplication": true
          }
        },
        "requestId": "request_example_01"
      }
order: 1000
