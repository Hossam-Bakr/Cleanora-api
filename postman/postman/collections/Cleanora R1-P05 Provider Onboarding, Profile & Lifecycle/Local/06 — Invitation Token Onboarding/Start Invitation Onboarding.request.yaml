$kind: http-request
description: Starts categoryless invitation-only onboarding for an invitee without a Cleanora identity. Uses the invitation's fixed email and captures challengeId when returned.
url: "{{baseUrl}}/provider-admin-invitations/onboarding/start"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{providerAdminInvitationToken}}",
      "phone": "{{invitedAdminPhone}}",
      "password": "{{testPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status", () => pm.expect([202]).to.include(pm.response.code));
      if (pm.response.code !== 204) {
        const body = pm.response.json();
        pm.test("Uses the Cleanora response envelope", () => {
          const succeeded = pm.response.code >= 200 && pm.response.code < 300;
          pm.expect(body.success).to.eql(succeeded);
          pm.expect(body.requestId).to.be.a("string");
          if (!succeeded) { pm.expect(body.error.statusCode).to.eql(pm.response.code); }
        });
        if (body.success === true && body.data && typeof body.data === "object") {
          const data = body.data;
          const currentVersion = data.version ?? data.provider?.version ?? data.application?.version;
          if (Number.isInteger(currentVersion) && currentVersion > 0) {
            pm.environment.set("providerVersion", String(currentVersion));
          }
      const capturedValue = data.challengeId ?? data.challenge?.id ?? data.verification?.challengeId;
      if (typeof capturedValue === "string" && capturedValue.length > 0) {
        pm.environment.set("challengeId", capturedValue);
      }
        }
      }
    language: text/javascript
examples: ./.resources/Start Invitation Onboarding.resources/examples
order: 2000
