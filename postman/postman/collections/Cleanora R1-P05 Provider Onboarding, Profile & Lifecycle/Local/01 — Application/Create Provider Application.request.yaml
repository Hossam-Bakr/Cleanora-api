$kind: http-request
description: Creates the caller's single Provider draft or returns the existing Provider. Requires an ACTIVE eligible Individual or Company customer identity with a complete matching customer profile. Captures providerId and providerVersion.
url: "{{baseUrl}}/providers"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "providerKind": "{{providerKind}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status", () => pm.expect([200,201]).to.include(pm.response.code));
      if (pm.response.code !== 204) {
        const body = pm.response.json();
        pm.test("Uses the Cleanora response envelope", () => {
          const succeeded = pm.response.code >= 200 && pm.response.code < 300;
          pm.expect(body.success).to.eql(succeeded);
          pm.expect(body.requestId).to.be.a("string");
          if (!succeeded) { pm.expect(body.error.statusCode).to.eql(pm.response.code); }
        });
        if (body.success === true && body.data && typeof body.data === "object") {
          const data = body.data;
          const currentVersion = data.version ?? data.provider?.version ?? data.application?.version;
          if (Number.isInteger(currentVersion) && currentVersion > 0) {
            pm.environment.set("providerVersion", String(currentVersion));
          }
      const capturedValue = data.id ?? data.providerId ?? data.provider?.id ?? data.application?.providerId;
      if (typeof capturedValue === "string" && capturedValue.length > 0) {
        pm.environment.set("providerId", capturedValue);
      }
        }
      }
    language: text/javascript
examples: ./.resources/Create Provider Application.resources/examples
order: 1000
