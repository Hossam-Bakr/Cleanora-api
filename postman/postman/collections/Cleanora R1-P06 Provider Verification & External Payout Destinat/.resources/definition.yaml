  currentPassword: ""
  sensitiveActionProof: ""
  revealAttemptId: ""
auth:
  - id: f6108167-021a-4e82-976c-0506ece352a9
    type: bearer
    name: bearer auth
    credentials:
      token: "{{accessToken}}"
