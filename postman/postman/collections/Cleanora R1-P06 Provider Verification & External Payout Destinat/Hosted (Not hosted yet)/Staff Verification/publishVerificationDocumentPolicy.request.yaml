$kind: http-request
description: R1-P06 publishVerificationDocumentPolicy.
url: "{{hostUrl}}/staff/providers/verification/document-policies/{{policyVersionId}}/publish"
method: POST
headers:
  Accept: application/json
  x-request-id: "{{requestId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expectedVersion": 1,
      "commandId": "00000000-0000-4000-8000-000000000018",
      "reason": "Reviewed and approved synthetic policy update"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status", () => pm.expect(pm.response.code).to.be.oneOf([200, 409 ]));
      pm.test("Envelope status code", () => { const body = pm.response.json(); if (!body.success) pm.expect(body.error.statusCode).to.eql(pm.response.code); });
    language: text/javascript
examples: ./.resources/publishVerificationDocumentPolicy.resources/examples
order: 5000
