$kind: http-example
request:
  url: "{{hostUrl}}/staff/providers/{{providerId}}/payout-destination-conflicts/{{conflictId}}/resolve"
  method: POST
  headers:
    Accept: application/json
    x-request-id: "{{requestId}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "outcome": "CANDIDATE_REJECTED",
        "reason": "Staff confirmed the incumbent claim remains authoritative",
        "expectedVersion": 1,
        "commandId": "00000000-0000-4000-8000-000000000037"
      }
response:
  statusCode: 200
  statusText: Synthetic success
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "success": true,
        "data": {
          "status": "SYNTHETIC_SUCCESS"
        },
        "requestId": "00000000-0000-4000-8000-000000000006"
      }
order: 1000
