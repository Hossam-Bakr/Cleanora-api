$kind: http-example
request:
  url: "{{hostUrl}}/providers/{{providerId}}/payout-destinations/{{destinationVersionId}}/submit"
  method: POST
  headers:
    Accept: application/json
    x-request-id: "{{requestId}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "expectedVersion": 1,
        "commandId": "00000000-0000-4000-8000-000000000027",
        "reauthenticationProof": "{{sensitiveActionProof}}"
      }
response:
  statusCode: 200
  statusText: Synthetic success
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "success": true,
        "data": {
          "status": "SYNTHETIC_SUCCESS"
        },
        "requestId": "00000000-0000-4000-8000-000000000006"
      }
order: 1000
