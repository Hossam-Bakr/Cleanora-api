$kind: http-request
description: R1-P06 removeProviderPayoutDestination.
url: "{{hostUrl}}/providers/{{providerId}}/payout-destinations/{{destinationVersionId}}/remove"
method: POST
headers:
  Accept: application/json
  x-request-id: "{{requestId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expectedVersion": 1,
      "expectedPrimaryVersion": 0,
      "replacementPrimaryDestinationVersionId": null,
      "acknowledgeReadinessLoss": true,
      "reason": "Owner confirms payout readiness will be removed",
      "reauthenticationProof": "{{sensitiveActionProof}}",
      "commandId": "00000000-0000-4000-8000-000000000029"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status", () => pm.expect(pm.response.code).to.be.oneOf([200, 409 ]));
      pm.test("Envelope status code", () => { const body = pm.response.json(); if (!body.success) pm.expect(body.error.statusCode).to.eql(pm.response.code); });
    language: text/javascript
examples: ./.resources/removeProviderPayoutDestination.resources/examples
order: 8000
