$kind: http-example
request:
  url: "{{hostUrl}}/providers/{{providerId}}/verification/documents/{{documentVersionId}}"
  method: PUT
  headers:
    Accept: application/json
    x-request-id: "{{requestId}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "countryCode": "EG",
        "documentNumber": "SYNTHETIC-DOC-0002",
        "legalName": "Synthetic Cleanora Company",
        "issuerName": "Synthetic Registry Authority",
        "issueDate": "2026-01-01",
        "expiresAt": null,
        "expectedVersion": 1,
        "commandId": "00000000-0000-4000-8000-000000000007"
      }
response:
  statusCode: 200
  statusText: Synthetic success
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "success": true,
        "data": {
          "status": "SYNTHETIC_SUCCESS"
        },
        "requestId": "00000000-0000-4000-8000-000000000006"
      }
order: 1000
