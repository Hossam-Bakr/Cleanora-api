$kind: http-request
description: R1-P06 getProviderVerificationOverview.
url: "{{baseUrl}}/providers/{{providerId}}/verification"
method: GET
headers:
  Accept: application/json
  x-request-id: "{{requestId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status", () => pm.expect(pm.response.code).to.be.oneOf([200, 403, 404 ]));
      pm.test("Envelope status code", () => { const body = pm.response.json(); if (!body.success) pm.expect(body.error.statusCode).to.eql(pm.response.code); });
    language: text/javascript
examples: ./.resources/getProviderVerificationOverview.resources/examples
order: 1000
