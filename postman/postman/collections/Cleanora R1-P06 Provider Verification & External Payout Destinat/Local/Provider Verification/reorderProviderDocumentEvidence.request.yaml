$kind: http-request
description: R1-P06 reorderProviderDocumentEvidence.
url: "{{baseUrl}}/providers/{{providerId}}/verification/documents/{{documentVersionId}}/evidence-order"
method: PUT
headers:
  Accept: application/json
  x-request-id: "{{requestId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "evidenceIds": [
        "{{evidenceId}}"
      ],
      "expectedVersion": 1,
      "commandId": "00000000-0000-4000-8000-000000000010"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status", () => pm.expect(pm.response.code).to.be.oneOf([200, 409 ]));
      pm.test("Envelope status code", () => { const body = pm.response.json(); if (!body.success) pm.expect(body.error.statusCode).to.eql(pm.response.code); });
    language: text/javascript
examples: ./.resources/reorderProviderDocumentEvidence.resources/examples
order: 9000
