$kind: http-request
description: R1-P06 createProviderPayoutDestination.
url: "{{baseUrl}}/providers/{{providerId}}/payout-destinations"
method: POST
headers:
  Accept: application/json
  x-request-id: "{{requestId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status", () => pm.expect(pm.response.code).to.be.oneOf([201, 409, 422 ]));
