$kind: http-example
request:
  url: "{{baseUrl}}/staff/providers/{{providerId}}/payout-destinations/{{destinationVersionId}}/decisions"
  method: POST
  headers:
    Accept: application/json
    x-request-id: "{{requestId}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "outcome": "APPROVE",
        "verificationMethod": "MANUAL_WALLET_TRANSFER_CHECK",
        "reasonCode": "VERIFIED_MATCH",
        "verificationNote": "External beneficiary holder name and wallet details matched",
        "acceptedRevealAttemptId": "{{revealAttemptId}}",
        "expectedVersion": 1,
        "commandId": "00000000-0000-4000-8000-000000000035"
      }
response:
  statusCode: 200
  statusText: Synthetic success
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "success": true,
        "data": {
          "status": "SYNTHETIC_SUCCESS"
        },
        "requestId": "00000000-0000-4000-8000-000000000006"
      }
order: 1000
