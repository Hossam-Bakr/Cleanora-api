$kind: http-request
description: Full replacement using the current address version.
url: "{{hostUrl}}/customers/addresses/{{addressId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "countryCode": "{{countryCode}}",
      "city": "{{city}}",
      "district": "{{district}}",
      "addressText": "{{addressText}}",
      "building": "{{building}}",
      "floor": "{{floor}}",
      "notes": "{{addressNotes}}",
      "version": {{addressVersion}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status", () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code !== 204) {
        const body = pm.response.json();
        pm.test("Uses the Cleanora response envelope", () => {
          pm.expect(body.success).to.eql(true);
          pm.expect(body.requestId).to.be.a("string");
        });
        if (body.data?.version) pm.environment.set("addressVersion", body.data.version);
      }
    language: text/javascript
examples: ./.resources/Update Address.resources/examples
order: 4000
