$kind: http-request
description: Returns owned request metadata. Missing and wrong-owner identifiers share the same safe 404 contract.
url: "{{hostUrl}}/customers/privacy-requests/{{privacyRequestId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status", () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code !== 204) {
        const body = pm.response.json();
        pm.test("Uses the Cleanora response envelope", () => {
          pm.expect(body.success).to.eql(true);
          pm.expect(body.requestId).to.be.a("string");
        });
      }
    language: text/javascript
examples: ./.resources/Get Privacy Request.resources/examples
order: 3000
