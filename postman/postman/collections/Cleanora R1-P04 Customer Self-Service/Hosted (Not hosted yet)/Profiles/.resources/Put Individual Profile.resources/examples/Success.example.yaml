$kind: http-example
request:
  url: "{{hostUrl}}/customers/profiles/individual"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "fullName": "{{individualFullName}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "category": "INDIVIDUAL",
          "created": true,
          "fullName": "Cleanora Individual"
        },
        "requestId": "request_example_01"
      }
order: 1000
