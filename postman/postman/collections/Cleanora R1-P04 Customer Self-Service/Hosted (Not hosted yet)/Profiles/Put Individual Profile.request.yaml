$kind: http-request
description: Creates or replaces the owned Individual profile fields.
url: "{{hostUrl}}/customers/profiles/individual"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "{{individualFullName}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status", () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code !== 204) {
        const body = pm.response.json();
        pm.test("Uses the Cleanora response envelope", () => {
          pm.expect(body.success).to.eql(true);
          pm.expect(body.requestId).to.be.a("string");
        });
      }
    language: text/javascript
examples: ./.resources/Put Individual Profile.resources/examples
order: 2000
