$kind: http-request
description: Cancels an owned request only while it is PENDING.
url: "{{baseUrl}}/customers/privacy-requests/{{privacyRequestId}}/cancel"
method: POST
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status", () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code !== 204) {
        const body = pm.response.json();
        pm.test("Uses the Cleanora response envelope", () => {
          pm.expect(body.success).to.eql(true);
          pm.expect(body.requestId).to.be.a("string");
        });
      }
    language: text/javascript
examples: ./.resources/Cancel Privacy Request.resources/examples
order: 4000
