$kind: http-request
description: Always replaces the current image using the required association-version CAS token. Select a local JPEG, PNG, or WebP no larger than 5 MiB if profileImagePath is not resolved by Postman.
url: "{{baseUrl}}/customers/profile-image"
method: PUT
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - "{{profileImagePath}}"
      description: Local JPEG/PNG/WebP file; maximum 5 MiB.
    - type: text
      key: expectedAssociationVersion
      value: "{{profileImageAssociationVersion}}"
      description: Current image association version.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status", () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code !== 204) {
        const body = pm.response.json();
        pm.test("Uses the Cleanora response envelope", () => {
          pm.expect(body.success).to.eql(true);
          pm.expect(body.requestId).to.be.a("string");
        });
        const version = body.data?.profileImage?.associationVersion ?? body.data?.associationVersion;
        if (version) pm.environment.set("profileImageAssociationVersion", version);
      }
    language: text/javascript
examples: ./.resources/Upload or Replace Profile Image.resources/examples
order: 2000
