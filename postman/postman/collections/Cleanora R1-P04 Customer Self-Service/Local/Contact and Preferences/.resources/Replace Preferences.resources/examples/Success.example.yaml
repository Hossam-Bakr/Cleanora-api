$kind: http-example
request:
  url: "{{baseUrl}}/customers/preferences"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "version": {{preferencesVersion}},
        "language": "EN",
        "reminders": {
          "sms": true,
          "push": true
        },
        "promotional": {
          "sms": false,
          "push": true
        },
        "mandatory": {
          "security": {
            "sms": true,
            "push": true
          },
          "activeService": {
            "sms": true,
            "push": true
          }
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "version": 2,
          "language": "EN",
          "reminders": {
            "sms": true,
            "push": true
          },
          "promotional": {
            "sms": false,
            "push": true
          },
          "mandatory": {
            "security": {
              "sms": true,
              "push": true
            },
            "activeService": {
              "sms": true,
              "push": true
            }
          }
        },
        "requestId": "request_example_01"
      }
order: 1000
