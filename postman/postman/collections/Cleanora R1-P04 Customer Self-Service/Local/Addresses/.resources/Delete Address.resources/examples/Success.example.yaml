$kind: http-example
request:
  url: "{{baseUrl}}/customers/addresses/{{addressId}}"
  method: DELETE
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "version": {{addressVersion}}
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "removed": true
        },
        "requestId": "request_example_01"
      }
order: 1000
