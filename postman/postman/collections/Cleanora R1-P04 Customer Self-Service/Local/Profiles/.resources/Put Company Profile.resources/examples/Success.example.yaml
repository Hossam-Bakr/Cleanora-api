$kind: http-example
request:
  url: "{{baseUrl}}/customers/profiles/company"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "companyName": "{{companyName}}",
        "representativeFullName": "{{representativeFullName}}",
        "commercialRegistrationNumber": "{{commercialRegistrationNumber}}",
        "taxRegistrationNumber": "{{taxRegistrationNumber}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "category": "COMPANY",
          "created": true,
          "companyName": "Cleanora Services",
          "representativeFullName": "Cleanora Representative",
          "commercialRegistrationNumber": "CR-EXAMPLE-001",
          "taxRegistrationNumber": "TAX-EXAMPLE-001"
        },
        "requestId": "request_example_01"
      }
order: 1000
