$kind: http-request
description: Returns the owned Engineer profile or the explicit not-created representation.
url: "{{baseUrl}}/customers/profiles/engineer"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status", () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code !== 204) {
        const body = pm.response.json();
        pm.test("Uses the Cleanora response envelope", () => {
          pm.expect(body.success).to.eql(true);
          pm.expect(body.requestId).to.be.a("string");
        });
      }
    language: text/javascript
examples: ./.resources/Get Engineer Profile.resources/examples
order: 5000
