openapi: 3.0.3
info:
  title: Cleanora R1-P17 Worker & Team Assignment
  version: 1.0.0
  description: >
    Provider assign/replace team or workers, assignment history, and worker
    order visibility. Status ACCEPTED→ASSIGNED on first assign. Intents only
    (no FCM/SMS/email). No fees, wallets, or staff write (EX-03).
paths:
  /api/v1/providers/{providerId}/bookings/{bookingId}/assignments/team:
    post:
      operationId: assignBookingTeam
      tags: [BookingAssignment]
      summary: Assign Browse-selected team (EX-01 booking.teamId only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: providerId
          required: true
          schema: { type: string }
        - in: path
          name: bookingId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedBookingVersion, teamId]
              properties:
                expectedBookingVersion: { type: integer, minimum: 1 }
                teamId: { type: string }
      responses:
        "200":
          description: Assignment created; booking ASSIGNED
        "403":
          description: Forbidden
        "409":
          description: State, crew, schedule, or version conflict
  /api/v1/providers/{providerId}/bookings/{bookingId}/assignments/workers:
    post:
      operationId: assignBookingWorkers
      tags: [BookingAssignment]
      summary: Assign ad-hoc workers
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: providerId
          required: true
          schema: { type: string }
        - in: path
          name: bookingId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedBookingVersion, workerIds]
              properties:
                expectedBookingVersion: { type: integer, minimum: 1 }
                workerIds:
                  type: array
                  items: { type: string }
                  minItems: 1
      responses:
        "200":
          description: Assignment created
        "409":
          description: Conflict
  /api/v1/providers/{providerId}/bookings/{bookingId}/assignments/team/replace:
    post:
      operationId: replaceBookingTeam
      tags: [BookingAssignment]
      summary: Replace ACTIVE assignment with Browse-selected team
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: providerId
          required: true
          schema: { type: string }
        - in: path
          name: bookingId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedBookingVersion, teamId]
              properties:
                expectedBookingVersion: { type: integer, minimum: 1 }
                teamId: { type: string }
      responses:
        "200":
          description: Assignment replaced
  /api/v1/providers/{providerId}/bookings/{bookingId}/assignments/workers/replace:
    post:
      operationId: replaceBookingWorkers
      tags: [BookingAssignment]
      summary: Replace ACTIVE assignment with workers
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: providerId
          required: true
          schema: { type: string }
        - in: path
          name: bookingId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedBookingVersion, workerIds]
              properties:
                expectedBookingVersion: { type: integer, minimum: 1 }
                workerIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Assignment replaced
  /api/v1/providers/{providerId}/bookings/{bookingId}/assignments/current:
    get:
      operationId: getCurrentBookingAssignment
      tags: [BookingAssignment]
      summary: Current ACTIVE assignment
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: providerId
          required: true
          schema: { type: string }
        - in: path
          name: bookingId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current assignment
        "404":
          description: No ACTIVE assignment
  /api/v1/providers/{providerId}/bookings/{bookingId}/assignments/history:
    get:
      operationId: getBookingAssignmentHistory
      tags: [BookingAssignment]
      summary: Assignment history
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: providerId
          required: true
          schema: { type: string }
        - in: path
          name: bookingId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: History entries
  /api/v1/workers/me/assignments:
    get:
      operationId: listMyWorkerAssignments
      tags: [WorkerAssignments]
      summary: ACTIVE assignments for the authenticated worker
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Worker assignment list
        "401":
          description: Authentication required
